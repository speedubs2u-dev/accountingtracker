<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代理记账控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 1. 将函数直接强行挂载到全局 window 对象，确保 onclick 绝对能找到 -->
  <script>
    window.toggleModal = function(id, show) {
      const el = document.getElementById(id);
      if (!el) return;
      if (show) {
        el.classList.remove('hidden');
        el.classList.add('flex');
      } else {
        el.classList.add('hidden');
        el.classList.remove('flex');
      }
    };

    window.exportBackup = function() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage.getItem('accounting_tracker_data') || '{}'));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    };

    window.initPage = function() {
      // 自动生成日期下拉框
      const select = document.getElementById('matrix-month-picker');
      if (select) {
        select.innerHTML = '';
        const today = new Date('2026-08-01');
        for (let i = -6; i <= 5; i++) {
          const d = new Date(today.getFullYear(), today.getMonth() + i, 1);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const opt = document.createElement('option');
          opt.value = `${y}-${m}`;
          opt.textContent = `${y}年${m}月`;
          if (i === 0) opt.selected = true;
          select.appendChild(opt);
        }
      }
    };

    // 页面加载完毕后立刻执行初始化
    window.addEventListener('DOMContentLoaded', window.initPage);
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-5">

  <div class="max-w-4xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <h1 class="text-xl font-bold">代理记账疑难追踪控制台 (2026)</h1>
      <div class="flex gap-2">
        <button onclick="window.exportBackup()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700">导出 JSON 备份</button>
        <button onclick="window.toggleModal('modal-company', true)" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-medium rounded">新增公司</button>
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
        <h2 class="text-sm font-bold text-slate-300">月度做账选择</h2>
        <!-- 日期下拉框 -->
        <select id="matrix-month-picker" class="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded p-2 outline-none font-mono">
          <option value="">加载中...</option>
        </select>
      </div>
    </main>
  </div>

  <!-- 弹窗测试 -->
  <div id="modal-company" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-sm w-full p-5 space-y-4">
      <h3 class="text-sm font-bold text-white">新增公司测试弹窗</h3>
      <p class="text-xs text-slate-400">如果看到这个窗口，说明 toggleModal 函数已成功修复！</p>
      <div class="flex justify-end gap-2">
        <button onclick="window.toggleModal('modal-company', false)" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs">关闭</button>
      </div>
    </div>
  </div>

</body>
</html>
