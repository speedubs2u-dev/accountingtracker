<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代理记账疑难追踪控制台 (Control Tower)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 font-sans">
  <div class="max-w-[1600px] mx-auto space-y-5">
    
    <!-- 1. 顶部 Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-xl font-bold text-white tracking-wide">代理记账疑难追踪控制台</h1>
          <span class="px-2 py-0.5 rounded text-xs font-semibold bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">Control Tower 2026</span>
        </div>
        <p class="text-slate-400 text-xs mt-1">Linear 级多企业账目对账、疑难流转与税务合规中枢</p>
      </div>
      <div class="flex items-center gap-3">
        <div id="connection-status" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> 数据库在线
        </div>
        <button onclick="toggleModal('modal-company', true)" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition shadow">+ 新增公司</button>
      </div>
    </header>

    <!-- 2. 主体网格布局 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      
      <!-- 左栏：托管公司列表与进度 (Col 3) -->
      <div class="lg:col-span-3 space-y-5">
        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-semibold text-white">托管公司列表</h2>
            <span id="company-count-badge" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">0 家</span>
          </div>
          <ul id="company-list" class="space-y-2 max-h-[380px] overflow-y-auto">
            <li class="text-slate-500 text-xs text-center py-4">正在读取公司...</li>
          </ul>
        </div>

        <!-- 月度做账矩阵（根据数据库做账清单真实计算） -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-xs font-semibold text-slate-300">月度做账进度汇总</h3>
            <span class="text-[10px] text-slate-500">2026年08月</span>
          </div>
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span class="text-slate-400">选定月份已完成:</span>
              <span id="overall-progress-text" class="text-emerald-400 font-bold">0% Completed</span>
            </div>
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
              <div id="overall-progress-bar" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 中栏：财务大盘与疑难事项 (Col 6) -->
      <div class="lg:col-span-6 space-y-5">
        
        <!-- 疑难账目大盘 -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <h2 class="text-sm font-semibold text-white">⚠️ 疑难账目大盘</h2>
              <span class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">合并所有公司</span>
            </div>
            <button onclick="toggleModal('modal-issue', true)" class="px-3 py-1 bg-indigo-600/80 hover:bg-indigo-600 text-white rounded text-xs font-medium transition">+ 手动新增 Issue</button>
          </div>

          <!-- 分类筛选器按钮 -->
          <div class="flex flex-wrap items-center gap-2 text-xs border-b border-slate-800 pb-3">
            <button onclick="filterIssues('all')" class="issue-filter-btn px-2.5 py-1 rounded bg-indigo-600 text-white">全部</button>
            <button onclick="filterIssues('missing_docs')" class="issue-filter-btn px-2.5 py-1 rounded bg-slate-800 text-slate-400 hover:text-white">📄 单据缺失</button>
            <button onclick="filterIssues('discrepancies')" class="issue-filter-btn px-2.5 py-1 rounded bg-slate-800 text-slate-400 hover:text-white">⚖️ 账面差额</button>
            <button onclick="filterIssues('unidentified_txn')" class="issue-filter-btn px-2.5 py-1 rounded bg-slate-800 text-slate-400 hover:text-white">🏦 银行不明</button>
          </div>

          <!-- 疑难事项列表 -->
          <div id="issues-container" class="space-y-2 max-h-[420px] overflow-y-auto">
            <p class="text-slate-500 text-xs text-center py-6">数据同步中...</p>
          </div>
        </div>
      </div>

      <!-- 右栏：税务与月度固定费用 (Col 3) -->
      <div class="lg:col-span-3 space-y-5">
        <!-- 月度法定/固定费用 -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
          <h3 class="text-sm font-semibold text-white mb-3">📋 月度法定 / 固定费用</h3>
          <ul id="checklist-container" class="space-y-2 text-xs">
            <li class="text-slate-500 text-center py-4">加载中...</li>
          </ul>
        </div>

        <!-- 税务 Tax Period 汇总 -->
        <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
          <h3 class="text-sm font-semibold text-white mb-3">🏛️ 税务 Tax Period 汇总</h3>
          <ul id="tax-container" class="space-y-2 text-xs">
            <li class="text-slate-500 text-center py-4">加载中...</li>
          </ul>
        </div>
      </div>

    </div>
  </div>

  <!-- 3. 新增公司 Modal 弹窗 -->
  <div id="modal-company" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-5 space-y-4">
      <h3 class="text-base font-bold text-white">新增托管公司</h3>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">公司名称</label>
          <input id="input-c-name" type="text" placeholder="例如: ABC Trading Sdn Bhd" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">公司类型</label>
          <select id="input-c-type" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none">
            <option value="sdn_bhd">Sdn Bhd</option>
            <option value="plt">PLT</option>
            <option value="sole_prop">Sole Prop</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">使用软件</label>
          <input id="input-c-sw" type="text" placeholder="例如: AutoCount / SQL Account" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleModal('modal-company', false)" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs">取消</button>
        <button onclick="submitCompany()" class="px-3 py-1.5 bg-indigo-600 text-white rounded text-xs font-medium">确认提交</button>
      </div>
    </div>
  </div>

  <!-- 4. 新增 Issue Modal 弹窗 -->
  <div id="modal-issue" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-5 space-y-4">
      <h3 class="text-base font-bold text-white">新增疑难事项</h3>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">关联公司 ID</label>
          <input id="input-i-cid" type="text" placeholder="例如: c1" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">分类</label>
          <select id="input-i-cat" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none">
            <option value="missing_docs">单据缺失</option>
            <option value="discrepancies">账面差额</option>
            <option value="unidentified_txn">银行不明</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">问题描述</label>
          <textarea id="input-i-desc" placeholder="请输入具体账目异常情况..." class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none h-20"></textarea>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">涉及金额</label>
          <input id="input-i-amt" type="text" placeholder="RM 0.00" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none">
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleModal('modal-issue', false)" class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs">取消</button>
        <button onclick="submitIssue()" class="px-3 py-1.5 bg-indigo-600 text-white rounded text-xs font-medium">保存疑难</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hlgqygezbkfcsmfycnit.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dhslQs_MzUqtdPuaz6qlHQ_R_m3ciq2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let rawIssues = [];

    // 初始化控制台
    async function init() {
      try {
        const [{ data: companies }, { data: issues }, { data: checklists }, { data: taxLogs }] = await Promise.all([
          _supabase.from('companies').select('*'),
          _supabase.from('issues').select('*'),
          _supabase.from('checklists').select('*'),
          _supabase.from('tax_logs').select('*')
        ]);

        rawIssues = issues || [];

        // 1. 渲染公司
        document.getElementById('company-count-badge').textContent = `${companies?.length || 0} 家`;
        document.getElementById('company-list').innerHTML = (companies || []).map(c => `
          <li class="p-2.5 bg-slate-800/40 border border-slate-800 rounded flex justify-between items-center text-xs">
            <div>
              <p class="font-medium text-slate-200">${c.name}</p>
              <p class="text-[10px] text-slate-400">${c.software}</p>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 bg-slate-700 text-slate-300 rounded uppercase font-mono">${c.type}</span>
          </li>
        `).join('');

        // 2. 真实计算完成度进度条
        if (checklists && checklists.length > 0) {
          const paidCount = checklists.filter(c => c.status === 'paid').length;
          const percent = Math.round((paidCount / checklists.length) * 100);
          document.getElementById('overall-progress-text').textContent = `${percent}% Completed`;
          document.getElementById('overall-progress-bar').style.width = `${percent}%`;
        }

        // 3. 渲染疑难列表
        renderIssues(rawIssues);

        // 4. 渲染 Checklist
        document.getElementById('checklist-container').innerHTML = (checklists || []).map(ck => `
          <li class="p-2 bg-slate-800/30 border border-slate-800 rounded flex justify-between items-center">
            <span class="text-slate-300">${ck.label}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded ${ck.status === 'paid' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">${ck.status}</span>
          </li>
        `).join('');

        // 5. 渲染 Tax
        document.getElementById('tax-container').innerHTML = (taxLogs || []).map(t => `
          <li class="p-2 bg-slate-800/30 border border-slate-800 rounded flex justify-between items-center">
            <span class="text-slate-300">${t.tax_year} ${t.tax_type}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded ${t.status === 'paid' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}">${t.status}</span>
          </li>
        `).join('');

      } catch (err) {
        console.error("加载数据失败:", err);
      }
    }

    // 渲染疑难卡片
    function renderIssues(list) {
      const container = document.getElementById('issues-container');
      if (!list || list.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-xs text-center py-6">暂无此类疑难事项</p>`;
        return;
      }
      container.innerHTML = list.map(i => `
        <div class="p-3 bg-slate-800/40 border border-slate-800 rounded-lg flex flex-col gap-1 text-xs">
          <div class="flex justify-between items-center">
            <span class="font-mono text-slate-400 font-bold">${i.company_id}</span>
            <span class="font-mono font-semibold text-amber-400">${i.amount}</span>
          </div>
          <p class="text-slate-200">${i.description}</p>
        </div>
      `).join('');
    }

    // 筛选 Issue
    function filterIssues(cat) {
      if (cat === 'all') {
        renderIssues(rawIssues);
      } else {
        renderIssues(rawIssues.filter(i => i.category === cat));
      }
    }

    // 控制 Modal 显示隐藏
    function toggleModal(id, show) {
      const el = document.getElementById(id);
      if (show) el.classList.remove('hidden'), el.classList.add('flex');
      else el.classList.add('hidden'), el.classList.remove('flex');
    }

    // 提交新公司到 Supabase
    async function submitCompany() {
      const name = document.getElementById('input-c-name').value;
      const type = document.getElementById('input-c-type').value;
      const software = document.getElementById('input-c-sw').value;
      if (!name) return alert('请输入公司名称');

      const { error } = await _supabase.from('companies').insert([{ name, type, software }]);
      if (error) alert('提交失败: ' + error.message);
      else {
        toggleModal('modal-company', false);
        init();
      }
    }

    // 提交新 Issue 到 Supabase
    async function submitIssue() {
      const company_id = document.getElementById('input-i-cid').value;
      const category = document.getElementById('input-i-cat').value;
      const description = document.getElementById('input-i-desc').value;
      const amount = document.getElementById('input-i-amt').value || 'RM 0';
      if (!company_id || !description) return alert('请填写公司ID和描述');

      const { error } = await _supabase.from('issues').insert([{ company_id, category, description, amount, status: 'pending' }]);
      if (error) alert('提交失败: ' + error.message);
      else {
        toggleModal('modal-issue', false);
        init();
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
